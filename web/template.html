<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AgentVault on NEAR · Red-team scoreboard</title>
<style>
:root{--bg:#0b0f14;--card:#121923;--line:#223042;--tx:#e6edf5;--mut:#8aa0b6;--ok:#3ddc97;--bad:#ff5d73;--acc:#7aa2ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:980px;margin:0 auto;padding:40px 20px 80px}
h1{font-size:28px;margin:0 0 4px}.sub{color:var(--mut);margin:0 0 28px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:28px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.tile b{display:block;font-size:30px;font-variant-numeric:tabular-nums}.tile span{color:var(--mut);font-size:13px}
.good b{color:var(--ok)}
.sc{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
.sc h3{margin:0;padding:14px 16px 2px;font-size:16px}.sc p{margin:0;padding:0 16px 10px;color:var(--mut);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13px}td{padding:8px 16px;border-top:1px solid var(--line)}
td:nth-child(3){text-align:right;font-variant-numeric:tabular-nums;color:var(--mut)}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}
.allowed{background:#12372a;color:var(--ok)}.blocked{background:#3a1822;color:var(--bad)}
.tag{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
footer{color:var(--mut);font-size:13px;margin-top:28px}code{background:#0e1620;padding:1px 6px;border-radius:6px}
</style></head><body><main>
<h1>AgentVault <span style="color:var(--acc)">on NEAR</span></h1>
<p class="sub">An AI agent is untrusted. The vault enforces the owner's limits, so a hijacked agent cannot exceed them. Every row below is produced by the same rules the contract runs.</p>
<div class="tiles" id="tiles"></div><div id="list"></div>
<footer>Reproduce in one command: <code>cd policy-core &amp;&amp; cargo run --example redteam</code></footer>
</main>
<script>
const D=/*DATA*/null;
const S=D.summary,el=(i)=>document.getElementById(i);
const near=y=>y==="340282366920938463463374607431768211455"?"u128::MAX":(Number(BigInt(y)/10n**20n)/1e4).toFixed(4)+" NEAR";
el("tiles").innerHTML=[
 ["good",`${S.attacks_blocked}/${S.attack_steps}`,"attacks blocked"],
 ["good",`${S.legit_allowed}/${S.legit_steps}`,"legit actions allowed"],
 ["good",S.funds_lost_yocto==="0"?"0":S.funds_lost_yocto,"funds lost to attackers"],
 ["",S.expectation_mismatches,"unexpected results"]
].map(([c,b,s])=>`<div class="tile ${c}"><b>${b}</b><span>${s}</span></div>`).join("");
el("list").innerHTML=D.scenarios.map(sc=>`<div class="sc"><h3>${sc.id}. ${sc.title}</h3><p>${sc.story}</p><table>${
 sc.steps.map(s=>`<tr><td><span class="tag">${s.kind}</span> ${s.label}</td><td><span class="pill ${s.verdict==="ALLOWED"?"allowed":"blocked"}">${s.verdict}</span></td><td>${near(s.amount_yocto)}</td></tr>`).join("")
}</table></div>`).join("");
</script></body></html>
